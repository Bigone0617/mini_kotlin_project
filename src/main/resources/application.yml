spring:
  application:
    name: mini-kec

  data:
    mongodb:
      uri: mongodb://localhost:27017/mini_kec

    redis:
      host: localhost
      port: 6379

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

  endpoint:
    health:
      show-details: always
